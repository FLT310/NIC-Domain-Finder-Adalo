<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIC Domain Finder</title>

<link rel="icon" href="assets/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/adalo.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">

</head>

<body>

<!-- ===========================
DASHBOARD
=========================== -->

<section class="dashboard">

    <div class="dashboard-card">

        <h3 id="searchCount">0</h3>

        <p>Recherches</p>

    </div>

    <div class="dashboard-card">

        <h3 id="lastSearch">-</h3>

        <p>Dernière</p>

    </div>

    <div class="dashboard-card">

        <h3 id="availableCount">0</h3>

        <p>Disponibles</p>

    </div>

</section>


<!-- ===========================
RECHERCHE
=========================== -->

<section class="search-section">

    <div class="search-box">

        <div class="search-input-wrapper">

            <input
                type="text"
                id="domainInput"
                placeholder="Rechercher un domaine .SN">

            <button
                id="clearSearchBtn"
                class="clear-search-btn"
                title="Effacer">

                &times;

            </button>

        </div>

        <button id="searchBtn">

            🔍 Rechercher

        </button>

    </div>

</section>


<!-- ===========================
LOADER
=========================== -->

<section id="loader" class="loader hidden">

    <div class="spinner"></div>

    <p>Recherche en cours...</p>

</section>


<!-- ===========================
RESULTATS
=========================== -->

<section id="resultSection" class="result-section hidden">

</section>


<!-- ===========================
SUGGESTIONS
=========================== -->

<section id="suggestionsSection" class="suggestions hidden">

    <h2>Suggestions</h2>

    <div id="suggestionsGrid"></div>

</section>


<!-- ===========================
HISTORIQUE
=========================== -->

<section class="history">

    <div class="history-header">

        <h2>Historique</h2>

        <button
            id="clearHistoryBtn"
            class="clear-btn">

            🗑

        </button>

    </div>

    <div id="historyContainer">

        <p>Aucune recherche.</p>

    </div>

</section>


<!-- ===========================
SCRIPTS
=========================== -->

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/helpers.js"></script>
<script src="js/ui.js"></script>
<script src="js/script.js"></script>

</body>

</html>
